# Local-only LiveKit SFU for Open Meeting Room audio.
#
# Start directly:
#   docker compose -p standard-science-livekit -f docker/compose.livekit.yml up -d
#
# Or use ./scripts/dev-meeting-audio.sh, which also starts the Standard Science
# backend/frontend with the matching local-development configuration.
#
# livekit-server --dev uses API key "devkey" and API secret "secret".
# These credentials are DEVELOPMENT-ONLY and must never be used in production.
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
