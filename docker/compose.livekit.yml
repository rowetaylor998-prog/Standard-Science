# Local-only SFU. Start from the project root:
# docker compose -f docker/compose.livekit.yml up -d
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
